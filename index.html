<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>学生成长报告 · 评估报告（桌面端原型）</title>
<style>
:root{
  --orange:#eb6900;--orange-soft:#fff5e8;--orange-line:#f0c89a;
  --text:#2f333c;--muted:#8a8f99;--line:#e6e7eb;--bg:#f3f4f6;--panel:#fff;
  --g0:#4f6f97;--g1:#4ea398;--g2:#b49d4f;--g3:#c47f55;--g4:#9a7a98;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font:14px/1.55 "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:var(--text);background:#e8eaee;overflow:hidden;
}
button,select{font:inherit;cursor:pointer}
button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:7px 12px;color:var(--text)}
button:hover{background:#fafafa}
button:disabled{opacity:.45;cursor:not-allowed}
select{border:1px solid #d9dbe1;border-radius:6px;padding:7px 10px;background:#fff;color:#444}
[hidden]{display:none!important}

/* —— 平台外壳（仅包装，不改报告正文） —— */
.platform{height:100%;display:flex;flex-direction:column;min-height:0}
.plat-top{
  flex-shrink:0;height:52px;background:#333e50;color:#fff;
  display:flex;align-items:center;justify-content:space-between;padding:0 18px;gap:16px;
}
.plat-brand{display:flex;align-items:center;gap:10px;min-width:0}
.plat-logo{
  width:28px;height:28px;border-radius:6px;background:#fff;color:#333e50;
  display:grid;place-items:center;font-weight:800;font-size:14px;flex-shrink:0;
}
.plat-brand-name{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plat-workbench{
  border:0;background:#fff;color:#333e50;border-radius:999px;padding:7px 22px;
  font-size:14px;font-weight:600;cursor:default;
}
.plat-top-right{display:flex;align-items:center;gap:18px;flex-shrink:0}
.plat-dl{display:inline-flex;align-items:center;gap:6px;color:#fff;font-size:13px;opacity:.95;cursor:default}
.plat-user{display:inline-flex;align-items:center;gap:8px;font-size:13px}
.plat-avatar{
  width:28px;height:28px;border-radius:50%;background:#4b7bec;display:grid;place-items:center;
  font-size:11px;font-weight:650;
}
.plat-body{flex:1;min-height:0;display:flex}
.plat-sider{
  width:210px;flex-shrink:0;background:#f4f5f7;border-right:1px solid #e2e4e8;
  display:flex;flex-direction:column;position:relative;transition:width .2s ease;
}
.platform.sider-collapsed .plat-sider{width:0;overflow:hidden;border-right:0}
.plat-collapse{
  position:absolute;top:14px;right:-12px;z-index:5;width:24px;height:24px;border-radius:50%;
  border:1px solid #d9dbe1;background:#fff;color:#8a8f99;padding:0;font-size:12px;
  display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.06);
}
.platform.sider-collapsed .plat-collapse{right:-12px;left:8px}
.plat-nav{padding:14px 10px 8px;display:flex;flex-direction:column;gap:4px}
.plat-nav-item{
  display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:6px;
  border:0;background:transparent;color:#4a5060;font-size:14px;text-align:left;width:100%;
  cursor:default;
}
.plat-nav-item.active{background:var(--orange-soft);color:var(--orange);font-weight:600}
.plat-nav-ico{width:16px;opacity:.75}
.plat-section{padding:8px 14px 6px;font-size:12px;color:#9aa0aa}
.plat-classes{flex:1;min-height:0;overflow:auto;padding:0 8px 8px}
.plat-class{
  display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:4px;
  color:#555b68;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.plat-sider-foot{flex-shrink:0;padding:10px;border-top:1px solid #e6e7eb}
.plat-app-center{
  display:flex;align-items:center;justify-content:center;gap:6px;padding:10px;
  border:1px dashed #f0c89a;border-radius:6px;color:var(--orange);font-size:13px;margin-bottom:10px;
}
.plat-term{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  font-size:11px;color:#6b7180;line-height:1.4;padding:4px 2px;
}
.plat-term button{border:0;background:transparent;color:#8a8f99;padding:2px 4px;font-size:14px}
.plat-main{
  flex:1;min-width:0;min-height:0;padding:12px;background:#eef0f3;overflow:hidden;
}

.app{
  height:100%;display:flex;flex-direction:column;background:#f7f8fa;
  max-width:none;margin:0;border-radius:8px;
  box-shadow:0 0 0 1px #e2e4e8,0 8px 24px rgba(30,35,50,.06);
}
.topbar{
  flex-shrink:0;height:52px;display:flex;align-items:center;justify-content:space-between;
  padding:0 22px;background:#fff;border-bottom:1px solid var(--line);
}
.topbar h1{margin:0;font-size:16px;font-weight:600;letter-spacing:.02em}
.icon-btn{
  width:32px;height:32px;border:0;border-radius:6px;background:transparent;
  color:#8b909a;font-size:20px;line-height:1;display:grid;place-items:center;
}
.icon-btn:hover{background:#f3f4f6;color:#555}

.student-head{
  flex-shrink:0;background:#fff;padding:18px 28px 8px;display:flex;gap:16px;align-items:flex-start;
}
.avatar{
  width:64px;height:64px;border-radius:8px;background:#d8d9de;color:#fff;
  display:grid;place-items:center;font-size:18px;font-weight:600;flex-shrink:0;
}
.student-meta h2{margin:2px 0 8px;font-size:22px;font-weight:700}
.meta-row{display:flex;flex-wrap:wrap;gap:18px;color:#6b707a;font-size:13px}
.meta-gender{margin-top:6px;color:#6b707a;font-size:13px}

.tabs{
  flex-shrink:0;background:#fff;display:flex;gap:36px;padding:0 28px;
  border-bottom:1px solid var(--line);
}
.tabs button{
  border:0;background:transparent;padding:14px 0 12px;color:#555;border-radius:0;
  border-bottom:3px solid transparent;font-size:14px;
}
.tabs button.active{color:var(--orange);font-weight:600;border-bottom-color:var(--orange)}
.tabs button:not(.active):hover{color:#222}

.panel-wrap{flex:1;min-height:0;padding:14px 16px 16px;background:#f0f1f4}
.panel{
  height:100%;background:var(--panel);border-radius:10px;border:1px solid #e4e5ea;
  box-shadow:0 1px 2px rgba(20,25,40,.03);display:flex;flex-direction:column;overflow:hidden;
}

/* 原型年级切换：浮动右上角，不占用报告正文流 */
.proto-float{
  position:fixed;top:16px;right:16px;z-index:90;
  font-family:inherit;
}
.proto-float-btn{
  border:1px solid var(--orange);background:var(--orange);color:#fff;
  padding:9px 14px;border-radius:8px;font-size:13px;font-weight:700;
  box-shadow:0 8px 20px rgba(235,105,0,.35);cursor:pointer;
}
.proto-float-btn:hover{background:#d45f00;border-color:#d45f00;color:#fff}
.proto-float-btn[aria-expanded="true"]{background:#c45600;border-color:#c45600;color:#fff}
.proto-float-panel{
  position:absolute;top:calc(100% + 8px);right:0;width:260px;
  background:#fff;border:1px solid #e7e8ed;border-radius:10px;
  box-shadow:0 12px 28px rgba(20,25,40,.16);padding:12px 14px;
}
.proto-float-panel[hidden]{display:none}
.proto-float-title{font-size:12px;font-weight:650;color:#a05a12;margin:0 0 8px}
.proto-float-panel label{display:block;font-size:12px;color:#6d7380;margin-bottom:6px}
.proto-float-panel select{
  width:100%;padding:7px 8px;font-size:13px;border:1px solid #e3e5ea;border-radius:6px;background:#fff;
}
.proto-float-hint{margin:8px 0 0;font-size:11px;line-height:1.45;color:#8a909b}

.report-chrome{
  flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  padding:14px 18px 10px;border-bottom:1px solid #f0f1f4;
}
.chrome-left{display:inline-flex;align-items:center;gap:10px;flex-wrap:wrap}
.subtabs{display:inline-flex;background:#f4f5f7;border-radius:8px;padding:3px}
.subtabs button{
  border:0;background:transparent;padding:8px 16px;border-radius:6px;color:#666;font-size:13px;
}
.subtabs button.active{background:#fff;color:var(--orange);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.fs-btn{
  width:34px;height:34px;display:inline-grid;place-items:center;padding:0;
  border:1px solid #e3e5ea;background:#fff;border-radius:8px;color:#5a6170;
  font-size:16px;line-height:1;cursor:pointer;
}
.fs-btn:hover{border-color:#f0c89a;color:var(--orange);background:#fff8f0}
.fs-close-btn{
  display:none;align-items:center;gap:6px;height:34px;padding:0 12px;
  border:1px solid #e3e5ea;background:#fff;border-radius:8px;color:#5a6170;
  font-size:12px;font-weight:600;cursor:pointer;
}
.fs-close-btn:hover{border-color:#f0c89a;color:var(--orange)}
.selectors{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.selectors label{display:flex;align-items:center;gap:6px;font-size:12px;color:#777}

/* 报告面板全屏：tabs + filters + TOC + content + download */
.fs-backdrop{
  position:fixed;inset:0;z-index:70;background:rgba(20,25,40,.45);
  opacity:0;pointer-events:none;transition:opacity .15s ease;
}
.fs-backdrop.show{opacity:1;pointer-events:auto}
.panel.report-fs{
  position:fixed;inset:16px;z-index:71;width:auto;height:auto;max-width:none;
  border-radius:12px;box-shadow:0 20px 48px rgba(20,25,40,.28);
}
.panel.report-fs .fs-btn{display:none}
.panel.report-fs .fs-close-btn{display:inline-flex}
body.report-fs-open{overflow:hidden}
.btn-pdf{
  background:var(--orange-soft);border-color:var(--orange-line);color:var(--orange);font-weight:600;
}
.btn-pdf:hover{background:#ffefd8}

.body-split{flex:1;min-height:0;display:grid;grid-template-columns:200px minmax(0,1fr)}
.side-nav{
  border-right:1px solid var(--line);overflow:auto;padding:12px 10px;background:#fafbfc;
}
.side-nav .group{font-size:11px;color:#9aa0aa;padding:8px 10px 6px;letter-spacing:.04em}
.side-nav a{
  display:block;padding:9px 10px;border-radius:6px;color:#4a5060;text-decoration:none;
  font-size:13px;margin-bottom:2px;
}
.side-nav a:hover{background:#f3f4f6}
.side-nav a.active{background:var(--orange-soft);color:var(--orange);font-weight:600}

.content{overflow:auto;padding:18px 22px 40px;scroll-behavior:smooth}
.section{scroll-margin-top:12px;margin-bottom:28px}
.section>h3{
  margin:0 0 12px;font-size:16px;font-weight:650;padding-bottom:8px;
  border-bottom:1px solid #eee;display:flex;align-items:center;gap:8px;
}
.section>h3 .tag{
  font-size:11px;font-weight:500;color:#888;background:#f3f4f6;padding:2px 8px;border-radius:999px;
}

.course{
  border:1px solid #e7e8ed;border-radius:8px;margin-bottom:12px;overflow:hidden;background:#fff;
}
.course-head{
  display:flex;justify-content:space-between;gap:16px;align-items:flex-start;
  padding:14px 16px;background:#fcfcfd;border-bottom:1px solid #f0f1f4;
}
.course-title{font-size:15px;font-weight:650}
.course-sub{margin-top:4px;font-size:12px;color:#9196a0}
.course-head .course-sub.teacher-only{margin-top:0}
.soft-badges{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.soft-item{display:flex;align-items:center;gap:6px;font-size:12px;color:#6d7380;position:relative}
.soft-val{
  min-width:28px;height:28px;display:grid;place-items:center;border-radius:5px;
  background:#f1f3f7;color:#556274;font-weight:650;font-size:13px;
}
.chev{
  border:0;background:transparent;padding:2px 4px;color:#9aa0aa;font-size:12px;line-height:1;
}
.chev:hover{color:var(--orange)}
.popover{
  position:absolute;top:calc(100% + 6px);right:0;z-index:20;min-width:220px;
  background:#fff;border:1px solid #e3e5ea;border-radius:8px;
  box-shadow:0 10px 28px rgba(25,30,45,.12);padding:8px;display:none;
}
.popover.open{display:block}
.popover .pop-row{
  display:flex;justify-content:space-between;gap:12px;padding:8px;border-radius:5px;font-size:12px;
}
.popover .pop-row:hover{background:#f7f8fa}
.popover .pop-row b{color:#556274}

.rows{padding:0 16px}
.row{
  display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:start;
  padding:12px 0;border-bottom:1px solid #f1f2f5;font-size:13px;color:#4a5160;
}
.row:last-child{border-bottom:0}
.row .ind::before{content:"◇ ";color:#b0b4bd}
.row.plain .ind::before{content:none}
.grade{
  min-width:36px;text-align:center;padding:3px 8px;border-radius:5px;
  background:#edf3fb;color:#4f6f97;font-weight:650;font-size:13px;
}
.grade.emnu{background:#f4f5f7;color:#5c6575}
/* B/C 与 A+/A/A- 同款浅蓝徽章，不再用 warn 橙底 */

/* 小学能力维度：产品风合并关系表（非 A3 灰表克隆） */
.ability-wrap{
  border:1px solid #e7e8ed;border-radius:8px;overflow:auto;background:#fff;margin-bottom:12px;
}
.ability-table{
  width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:13px;min-width:720px;
}
.ability-table th{
  background:#f7f8fa;color:#5a6170;font-weight:600;padding:11px 10px;text-align:center;
  border-bottom:1px solid #e7e8ed;font-size:12px;
}
.ability-table th+th,.ability-table td+td{border-left:1px solid #f0f1f4}
.ability-table td{
  padding:11px 12px;vertical-align:middle;color:#3a4150;border-bottom:1px solid #f0f1f4;
  background:#fff;
}
.ability-table tr:last-child td{border-bottom:0}
.ability-table td.ind-cell{text-align:left;line-height:1.5}
.ability-table td.ind-cell .mark{color:#9aa1ad;margin-right:4px}
.ability-table td.center{text-align:center}
.ability-table th.th-teachers{
  text-align:left;vertical-align:middle;padding:10px 12px;
}
.ability-table th.th-teachers .th-label{
  font-size:11px;font-weight:500;color:#8a909b;margin-bottom:4px;
}
.ability-table th.th-teachers .th-names{
  font-size:12px;font-weight:600;color:#4a5160;line-height:1.55;
}
.ability-table .cell-grade{
  display:inline-grid;place-items:center;min-width:32px;height:28px;padding:0 8px;
  border-radius:5px;font-weight:650;font-size:13px;background:#edf3fb;color:#4f6f97;
}
.ability-table .cell-grade.emnu{background:#f4f5f7;color:#5c6575}
.cell-grade{display:inline-grid;place-items:center;min-width:32px;height:28px;padding:0 8px;border-radius:5px;font-weight:650;font-size:13px;background:#edf3fb;color:#4f6f97}
.cell-grade.emnu{background:#f4f5f7;color:#5c6575}
.ability-table col.c-ind{width:auto}
.ability-table col.c-ac{width:88px}
.ability-table col.c-self{width:88px}
.ability-table col.c-team{width:96px}

.ability-extras{display:flex;flex-direction:column;gap:10px;margin-top:4px}
/* 初中艺技体短周课夹层：卡片之间正常竖向间距 */
.j-shorts-stack{display:flex;flex-direction:column;gap:10px}
.extra-block{
  border:1px solid #e7e8ed;border-radius:8px;background:#fff;overflow:hidden;
}
.extra-block .extra-head{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px 16px;background:#fcfcfd;border-bottom:1px solid #f0f1f4;
}
.extra-block .extra-head.simple{border-bottom:0}
/* 小学劳动/体质/食育/服育：白底（非浅灰） */
.ability-extras .extra-head.simple{background:#fff}
/* 初中体质体能：白底 */
.fitness-block .extra-head.simple{background:#fff}
.extra-block .extra-title{font-size:14px;font-weight:600;color:#3a4150}
.extra-block .extra-sub{font-size:12px;color:#9196a0;margin-top:2px}

/* 艺技体短课：独立课程卡片（参考样张） */
.short-course{
  border:1px solid #e7e8ed;border-radius:8px;background:#fff;overflow:hidden;
}
.short-course .sc-head{
  display:flex;justify-content:space-between;align-items:flex-start;gap:16px;
  padding:14px 16px;border-bottom:1px solid #f0f1f4;
}
.short-course .sc-name{font-size:15px;font-weight:650;color:#2f333c}
.short-course .sc-teacher{margin-top:0;font-size:12px;color:#9196a0}
.short-course .sc-soft{
  display:flex;gap:16px;align-items:center;flex-wrap:wrap;font-size:12px;color:#6d7380;
}
.short-course .sc-soft .soft-item{display:inline-flex;align-items:center;gap:6px}
.short-course .sc-body{
  display:flex;justify-content:space-between;align-items:center;gap:16px;
  padding:12px 16px;font-size:13px;color:#4a5160;
}
/* 底栏课程名：与食育/服育标题同级大号粗黑（小学 ability-extras / 初中领域内共用） */
.short-course .sc-ind{
  font-size:14px;font-weight:600;color:#3a4150;
}
.ability-extras .short-course .sc-ind{
  font-size:14px;font-weight:600;color:#3a4150;
}

.kv-block{
  border:1px solid #e7e8ed;border-radius:8px;padding:14px 16px;background:#fff;
}
.kv-block p{margin:0 0 8px;color:#555}
.kv-block p:last-child{margin:0}

.labor-box{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  border:1px solid #e7e8ed;border-radius:8px;padding:14px 16px;background:#fff;
}
.labor-box .labor-label{font-size:14px;color:#3a4150;font-weight:500}

.legend{
  margin-top:16px;border:1px solid #e7e8ed;border-radius:8px;background:#fff;overflow:hidden;
}
.legend>summary{
  list-style:none;cursor:pointer;padding:14px 16px;font-size:14px;font-weight:650;color:#3a4150;
  background:#fcfcfd;border-bottom:1px solid transparent;user-select:none;
}
.legend>summary::-webkit-details-marker{display:none}
.legend>summary::after{content:"▾";float:right;color:#9aa0aa;font-weight:400}
.legend[open]>summary{border-bottom-color:#f0f1f4}
.legend[open]>summary::after{content:"▴"}
.legend-body{padding:14px 16px 16px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:900px){.legend-body{grid-template-columns:1fr}}
.legend-card{
  border:1px solid #eceef2;border-radius:8px;background:#fafbfc;padding:12px 14px;
}
.legend-card h4{
  margin:0 0 10px;font-size:13px;font-weight:650;color:#4a5160;
}
.legend-soft-title{
  margin:0 0 10px;font-size:13px;font-weight:650;color:#4a5160;
  display:flex;flex-direction:column;gap:3px;line-height:1.35;
}
.legend-soft-title span{display:block}
.legend-row{
  display:flex;align-items:center;gap:10px;padding:7px 0;
  border-top:1px solid #eef0f3;font-size:12px;color:#5a6170;line-height:1.45;
}
.legend-row:first-of-type{border-top:0;padding-top:0}
.legend-row .cell-grade,.legend-row .soft-val{flex-shrink:0}

.empty-state{
  min-height:420px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:#9399a5;gap:10px;padding:40px;
}
.empty-illu{
  width:120px;height:90px;border-radius:12px;background:linear-gradient(135deg,#eceef2,#f7f8fa);
  border:1px solid #e4e6eb;position:relative;margin-bottom:8px;
}
.empty-illu::before,.empty-illu::after{
  content:"";position:absolute;background:#fff;border:1px solid #dde0e6;border-radius:4px;
}
.empty-illu::before{width:48px;height:58px;left:22px;top:16px;transform:rotate(-8deg)}
.empty-illu::after{width:48px;height:58px;right:22px;top:12px;transform:rotate(10deg);background:#f3f5f8}
.empty-state h4{margin:0;font-size:16px;font-weight:600;color:#6b7180}
.empty-state p{margin:0;font-size:13px}

.trend-wrap{padding:18px 22px 36px;overflow:auto;height:100%}
.trend-toolbar{
  display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-end;
  margin-bottom:14px;
}
.trend-toolbar h3{margin:0 0 4px;font-size:17px}
.trend-toolbar p{margin:0;font-size:12px;color:#8a909b}
.filters{
  background:#fafbfc;border:1px solid #e7e8ed;border-radius:8px;padding:12px 14px;margin-bottom:14px;
}
.filter-line{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:6px 0;font-size:13px}
.filter-line strong{font-size:12px;color:#777;min-width:64px}

.chart-grid{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:14px}

.chart-card,.notes-card{
  background:#fff;border:1px solid #e7e8ed;border-radius:8px;padding:16px;
}
.chart-card{position:relative}

}

.notes-card.below{padding:12px 14px}

.notes-card.below .notes-legend-row{margin-bottom:8px}
.trend-wrap.compact{padding:10px 16px 14px}
.trend-wrap.compact .trend-toolbar{margin-bottom:6px}
.trend-wrap.compact .trend-toolbar > div{
  display:flex;align-items:baseline;gap:12px;width:100%;flex-wrap:wrap;
}
.trend-wrap.compact .trend-toolbar h3{font-size:16px;margin:0;flex-shrink:0}
.trend-wrap.compact .trend-toolbar p{font-size:12px;margin:0;flex:1;min-width:200px;line-height:1.45}
.trend-wrap.compact .filters{margin-bottom:8px;padding:8px 10px}
.chart-tooltip{
  position:absolute;z-index:8;min-width:160px;max-width:240px;padding:10px 12px;
  background:#2f333c;color:#fff;border-radius:8px;font-size:12px;line-height:1.45;
  box-shadow:0 8px 20px rgba(20,25,40,.18);pointer-events:none;opacity:0;
  transform:translate(-50%,-110%);transition:opacity .12s ease;
}
.chart-tooltip.show{opacity:1}
.chart-tooltip strong{font-weight:650}
.notes-card h4{margin:0 0 10px;font-size:14px}
.notes-card p{margin:0 0 8px;font-size:12px;color:#7a8290}
.notes-card p:last-child{margin-bottom:0}
.notes-card hr{border:0;border-top:1px solid #eceef2;margin:12px 0}
.notes-card.below .notes-legend-row{
  display:flex;flex-wrap:wrap;gap:14px 18px;align-items:center;margin-bottom:12px;
}
.notes-card.below .notes-legend-row span{
  display:inline-flex;align-items:center;gap:6px;font-size:13px;color:#4a5160;
}

.toast{
  position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);
  background:#2f333c;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;

}

@media(max-width:980px){

function currentReport(){
  const includeSummary = state.seg === 3;
  if(band()==='primary') return mockPrimary();
  if(band()==='junior') return mockJunior(includeSummary);
  return mockHigh(includeSummary);
}

function hasData(){
  return availability[`${state.year}|${yearSeg()}`] === 'ok';
}

function buildTrendSeries(){
  const b = band();
  let names;
  if(b==='primary') names = ['整体'];
  else if(b==='junior') names = DOMAINS.slice();
  else names = (HS_SUBJECTS[state.grade] || HS_SUBJECTS[10]).slice();
  const seed = [
    [2,3,1,0,0],[3,2,1,0,0],[2,2,2,0,0],[1,3,1,1,0],[3,1,1,0,0],[2,2,1,0,0]
  ];
  return names.map((name,i)=>{
    const v = [];
    for(let t=1;t<=6;t++){
      const key = `${state.year}|${t}`;
      if(availability[key] !== 'ok'){ v.push(null); continue; }
      const base = seed[(i + t) % seed.length].slice();
      base[i % 5] = Math.max(0, base[i % 5] + ((i+t)%2));
      v.push(base);
    }
    return {name, v};
  });
}

function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>el.classList.remove('show'), 2200);
}

function closePopovers(e){
  if(e && e.target.closest && e.target.closest('.soft-item')) return;
  document.querySelectorAll('.popover.open').forEach(p=>p.classList.remove('open'));
  state.openPopover = null;
}
document.addEventListener('click', closePopovers);

function softBadge(label, value, list, key){
  const multi = list && list.length > 1;
  const id = 'pop-' + key;
  return `<span class="soft-item">
    ${label}<b class="soft-val">${value || '—'}</b>
    ${multi ? `<button type="button" class="chev" aria-expanded="false" aria-controls="${id}" onclick="toggleSoftPopover(event,'${id}')" title="查看全部">▾</button>
      <div class="popover" id="${id}" role="dialog">${list.map(x=>`<div class="pop-row"><span>${x.label}</span><b>${x.v}</b></div>`).join('')}</div>` : ''}
  </span>`;
}

function toggleSoftPopover(ev, id){
  ev.stopPropagation();
  const el = document.getElementById(id);
  const willOpen = !el.classList.contains('open');
  closePopovers();
  if(willOpen){
    el.classList.add('open');
    state.openPopover = id;
  }
}

function gradeClass(g){
  // 学术 A+/A/A-/B/C 统一浅蓝徽章；非学术 E/M/N/U 用灰底
  if(['E','M','N','U'].includes(g)) return 'grade emnu';
  return 'grade';
}

/* ========== 选择器：学年学期合并 ========== */
function fillSelectors(){
  const yt = document.getElementById('selYearTerm');
  const opts = [];
  YEARS.forEach(y=>{
    [1,2].forEach(t=>{
      const val = `${y}|${t}`;
      const label = `${y}学年 ${termLabel(t)}`;
      opts.push(`<option value="${val}" ${state.year===y && state.term===t?'selected':''}>${label}</option>`);
    });
  });
  yt.innerHTML = opts.join('');
  const seg = document.getElementById('selSeg');
  seg.innerHTML = [1,2,3].map(n=>{
    const ys = (state.term-1)*3 + n;
    const empty = availability[`${state.year}|${ys}`] !== 'ok';
    return `<option value="${n}" ${n===state.seg?'selected':''}>第${n}小学段${empty?'（未同步）':''}</option>`;
  }).join('');
}

function onHistoryChange(){
  const [y,t] = document.getElementById('selYearTerm').value.split('|');
  state.year = y;
  state.term = Number(t);
  state.seg = Number(document.getElementById('selSeg').value);
  state.trendTermContext = state.term;
  fillSelectors();
  if(state.mode==='report') renderReport();
  else renderTrend();
}

function onGradePreview(v){
  state.grade = Number(v);
  state.trendScope = 'overall';
  state.activeNav = '';
  const sel = document.getElementById('gradePreview');
  if(sel && String(sel.value) !== String(v)) sel.value = String(v);
  document.getElementById('metaGrade').textContent = gradeLabel(state.grade);
  document.getElementById('metaCohort').textContent = cohortFor(state.grade) + '届';
  if(state.mode==='report') renderReport();
  else renderTrend();
}

function toggleProtoFloat(ev){
  ev.stopPropagation();
  const panel = document.getElementById('protoFloatPanel');
  const btn = document.getElementById('protoFloatBtn');
  const open = panel.hasAttribute('hidden');
  if(open){
    panel.removeAttribute('hidden');
    btn.setAttribute('aria-expanded','true');
    const sel = document.getElementById('gradePreview');
    if(sel) sel.value = String(state.grade);
  } else {
    panel.setAttribute('hidden','');
    btn.setAttribute('aria-expanded','false');
  }
}
function closeProtoFloat(e){
  if(e && e.target.closest && e.target.closest('#protoFloat')) return;
  const panel = document.getElementById('protoFloatPanel');
  const btn = document.getElementById('protoFloatBtn');
  if(!panel || panel.hasAttribute('hidden')) return;
  panel.setAttribute('hidden','');
  if(btn) btn.setAttribute('aria-expanded','false');
}
document.addEventListener('click', closeProtoFloat);

function enterReportFullscreen(){
  const panel = document.querySelector('.panel-wrap > .panel');
  const backdrop = document.getElementById('fsBackdrop');
  if(!panel) return;
  panel.classList.add('report-fs');
  document.body.classList.add('report-fs-open');
  if(backdrop){
    backdrop.hidden = false;
    requestAnimationFrame(()=>backdrop.classList.add('show'));
  }
  state.reportFs = true;
}
function exitReportFullscreen(){
  const panel = document.querySelector('.panel-wrap > .panel');
  const backdrop = document.getElementById('fsBackdrop');
  if(panel) panel.classList.remove('report-fs');
  document.body.classList.remove('report-fs-open');
  if(backdrop){
    backdrop.classList.remove('show');
    backdrop.hidden = true;
  }
  state.reportFs = false;
}
document.addEventListener('keydown', (e)=>{
  if(e.key === 'Escape'){
    if(state.reportFs) exitReportFullscreen();
    else closeProtoFloat();
  }
});

function setMode(mode){
  state.mode = mode;
  document.getElementById('tabReport').classList.toggle('active', mode==='report');
  document.getElementById('tabTrend').classList.toggle('active', mode==='trend');
  document.getElementById('tabReport').setAttribute('aria-selected', mode==='report');
  document.getElementById('tabTrend').setAttribute('aria-selected', mode==='trend');
  document.getElementById('reportView').hidden = mode!=='report';
  document.getElementById('trendView').hidden = mode!=='trend';
  if(mode==='report') renderReport();
  else renderTrend();
}

function renderSideNav(report){
  const nav = document.getElementById('sideNav');
  // bareShorts（艺技体短周课夹层）不进目录
  const items = report.modules.filter(m=>!m.bareShorts).map(m=>({id:m.id,title:m.title}));
  if(!state.activeNav || !items.find(x=>x.id===state.activeNav)){
    state.activeNav = items[0]?.id || '';
  }
  nav.innerHTML = `<div class="group">目录</div>` + items.map(it=>
    `<a href="#sec-${it.id}" class="${it.id===state.activeNav?'active':''}" data-nav="${it.id}" onclick="jumpNav(event,'${it.id}')">${it.title}</a>`
  ).join('');
}

function jumpNav(ev, id){
  ev.preventDefault();
  state.activeNav = id;
  document.querySelectorAll('#sideNav a').forEach(a=>a.classList.toggle('active', a.dataset.nav===id));
  const target = document.getElementById('sec-'+id);
  if(target) target.scrollIntoView({behavior:'smooth', block:'start'});
}

function renderCourse(c, keyBase){
  const selfVal = (c.selfList && c.selfList[0]?.v) || c.self || '—';
  const teamVal = (c.teamList && c.teamList[0]?.v) || c.team || '—';
  // 初中单科领域：任课教师用小灰字（.course-sub），不用大号粗黑标题
  const titleHtml = c.hideCourseTitle
    ? (c.teacher ? `<div class="course-sub teacher-only">任课教师 ${c.teacher}</div>` : '')
    : `<div class="course-title">${c.name}</div>
        <div class="course-sub">${c.teacher ? '任课教师 '+c.teacher : ''}</div>`;
  const rowCls = c.rowPlain ? 'row plain' : 'row';
  return `<article class="course">
    <div class="course-head">
      <div>
        ${titleHtml}
      </div>
      <div class="soft-badges">
        ${softBadge('自主学习', selfVal, c.selfList, keyBase+'-self')}
        ${softBadge('参与与合作', teamVal, c.teamList, keyBase+'-team')}
      </div>
    </div>
    <div class="rows">
      ${(c.rows||[]).map(r=>`<div class="${rowCls}"><span class="ind">${r[0]}</span><span class="${gradeClass(r[1])}">${r[1]}</span></div>`).join('')}
      ${c.writing ? `<div class="row"><span class="ind">书写能力</span><span class="${gradeClass(c.writing)}">${c.writing}</span></div>` : ''}
    </div>
  </article>`;
}

/** 小学能力维度主表：左表头展示任课教师；无右侧教师列 */
function renderAbilityTable(table){
  const blocks = table.blocks || [];
  const teachers = table.teachers || [];
  let body = '';

  blocks.forEach(block=>{
    const indCount = block.groups.reduce((n,g)=>n+g.texts.length, 0);
    let blockRow = 0;
    block.groups.forEach((g, gi)=>{
      g.texts.forEach((text, ti)=>{
        body += '<tr>';
        body += `<td class="ind-cell"><span class="mark">◇</span>${text}</td>`;
        if(ti===0){
          body += `<td class="center" rowspan="${g.texts.length}">${chip(g.academic)}</td>`;
        }
        if(blockRow===0 && ti===0 && gi===0){
          body += `<td class="center" rowspan="${indCount}">${chip(block.self)}</td>`;
          body += `<td class="center" rowspan="${indCount}">${chip(block.team)}</td>`;
        }
        body += '</tr>';
        blockRow++;
      });
    });
    if(block.writing){
      body += '<tr>';
      body += `<td class="ind-cell"><span class="mark">◇</span>书写能力</td>`;
      body += `<td class="center" colspan="3">${chip(block.writing)}</td>`;
      body += '</tr>';
    }
  });

  const teacherHead = `<th class="th-teachers" scope="col">
      <div class="th-label">任课教师</div>
      <div class="th-names">${teachers.join(' · ') || '—'}</div>
    </th>`;

  return `<div class="ability-wrap"><table class="ability-table" aria-label="能力维度">
    <colgroup>
      <col class="c-ind"><col class="c-ac"><col class="c-self"><col class="c-team">
    </colgroup>
    <thead>
      <tr>
        ${teacherHead}
        <th>学术水平</th>
        <th>自主学习</th>
        <th>参与与合作</th>
      </tr>
    </thead>
    <tbody>${body}</tbody>
  </table></div>`;
}

      return `<div class="extra-block"><div class="extra-head simple"><span class="extra-title">${ex.label}</span>${right}</div></div>`;

    if(ex.kind==='shorts'){

  const pdfBtn = document.getElementById('btnPdf');
  if(!hasData()){
    document.getElementById('sideNav').innerHTML = `<div class="group">目录</div><div style="padding:12px 10px;color:#9aa0aa;font-size:12px;line-height:1.6">当前小学段无可用报告数据</div>`;
    content.innerHTML = `<div class="empty-state"><div class="empty-illu" aria-hidden="true"></div><h4>无报告单数据</h4><p>该学年学期 / 小学段尚未同步或未发布结构化报告。<br>仍可切换其他小学段；下载 PDF 暂不可用。</p></div>`;
    pdfBtn.disabled = true;
    return;
  }
  pdfBtn.disabled = false;
  const report = currentReport();
  renderSideNav(report);

  let html = '';

  report.modules.forEach(m=>{
    html += `<section class="section" id="sec-${m.id}">`;
    // 初中：数学领域前的艺技体短周课夹层 — 无领域标题，仅卡片
    if(m.bareShorts){
      html += `<div class="j-shorts-stack">${(m.shortCourses||[]).map(c=>renderShortCourseCard(c)).join('')}</div>`;
      html += `</section>`;
      return;
    }
    html += `<h3>${m.title}${m.id==='summary'?'<span class="tag">学期末小学段</span>':''}</h3>`;
    if(m.abilityTable){
      html += renderAbilityTable(m.abilityTable);
      html += renderAbilityExtras(m.abilityExtras);
    } else if(m.laborGrade){
      html += `<div class="labor-box"><span class="labor-label">劳动教育</span><span class="${gradeClass(m.laborGrade)}">${m.laborGrade}</span></div>`;
    } else if(m.courses){
      if(m.fitness){
        // 初中/高中体质体能：白底
        html += `<div class="extra-block fitness-block" style="margin-bottom:12px"><div class="extra-head simple"><span class="extra-title">体质体能</span><span style="color:#5a6170;font-weight:600">${m.fitness}</span></div></div>`;
      }
      const regular = m.courses.filter(c=>!c.shortCourse);
      const shorts = m.courses.filter(c=>c.shortCourse);
      regular.forEach((c,ci)=>{ html += renderCourse(c, m.id+'-'+ci); });
      if(shorts.length){
        html += `<div class="j-shorts-stack">${shorts.map(c=>renderShortCourseCard(c)).join('')}</div>`;
      }
    } else if(m.rows){
      const plain = m.plain ? ' plain' : '';
      html += `<div class="kv-block"><div class="rows" style="padding:0">${m.rows.map(r=>`<div class="row${plain}"><span class="ind">${r[0]}</span><span class="${gradeClass(r[1])}">${r[1]}</span></div>`).join('')}</div></div>`;
    } else if(m.text){
      html += `<div class="kv-block"><p>${m.text}</p></div>`;
    }
    html += `</section>`;
  });

  html += renderLegend(report);

  content.innerHTML = html;
  const first = report.modules[0];
  if(first){
    state.activeNav = first.id;
    document.querySelectorAll('#sideNav a').forEach(a=>a.classList.toggle('active', a.dataset.nav===first.id));
  }
}

function downloadPdf(){
  if(!hasData()){
    toast('无报告单数据，无法下载');
    return;
  }
  const title = `云天学院_${document.getElementById('studentName').textContent}_${state.year}_${gradeLabel(state.grade)}_第${yearSeg()}学段_A3打印版`;
  const blob = new Blob(
    [`%PDF-1.4\n% 原型占位文件\n% ${title}\n% 正式环境将导出 A3 打印版 PDF（非电子排版版）\n`],
    {type:'application/pdf'}
  );
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = title + '.pdf';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
  toast('已开始下载 A3 打印版 PDF');
}

function axisSegments(){
  // 小学 / 初中 / 高中：横轴固定第1–6学段
  if(band()==='primary' || band()==='junior' || band()==='high') return [1,2,3,4,5,6];
  if(state.trendTermContext === 1) return [1,2,3];
  return [1,2,3,4,5,6];
}

function renderTrend(){
  fillSelectors();
  // 轴口径跟随顶栏学年学期选择（已删独立「轴口径学期」控件）
  state.trendTermContext = state.term;
  if(band()==='primary') state.trendScope = 'overall';
  const series = buildTrendSeries();
  const b = band();
  // 小学 / 初中 / 高中：标题旁免责声明、图例在下、紧凑图；初高中保留统计范围
  const trendCompact = b==='primary' || b==='junior' || b==='high';
  const wrap = document.getElementById('trendView');
  const scopeOptions = b==='primary'
    ? ''
    : series.map(s=>`<label><input type="radio" name="scope" value="${s.name}" ${state.trendScope===s.name?'checked':''} onchange="setTrendScope(this.value)">${s.name}</label>`).join('');

  const scopeFilter = b==='primary' ? '' : `<div class="filter-line">
        <strong>统计范围</strong>
        <label><input type="radio" name="scope" value="overall" ${state.trendScope==='overall'?'checked':''} onchange="setTrendScope('overall')">总体</label>
        ${scopeOptions}
      </div>`;

  const chartHead = trendCompact ? '' : `<div style="display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-bottom:4px">
          <strong id="scopeTitle">总体等级分布</strong>
          <span style="color:#9097a2;font-size:12px" id="chartMeta"></span>
        </div>`;

  const subtitle = trendCompact
    ? '不同学段下，学习目标、难度及等级记录数量可能不同，本趋势图仅呈现占比分布变化，不能直接认定能力进退'
    : '仅统计学术水平 A+/A/A-/B/C；空等级与「学术水平单科汇总」不计入。缺失学段留空、不连线。';
  // 小学：固定总体分母；初中：总体/领域；高中：总体/学科（均用「小学段」口径）
  let notesExtra;
  if(b==='primary'){
    notesExtra = `<p><strong>该等级占比</strong>＝该等级数量 ÷ 该小学段「学术水平」总数 × 100%。</p>`;
  } else if(b==='junior'){
    const denom = state.trendScope==='overall'
      ? '该小学段「学术水平」总数'
      : '该小学段该领域的「学术水平」总数';
    notesExtra = `<p><strong>该等级占比</strong>＝该等级数量 ÷ ${denom} × 100%。</p>`;
  } else if(b==='high'){
    const denom = state.trendScope==='overall'
      ? '该小学段「学术水平」总数'
      : '该小学段该学科的「学术水平」总数';
    notesExtra = `<p><strong>该等级占比</strong>＝该等级数量 ÷ ${denom} × 100%。</p>`;
  } else {
    notesExtra = `<p><strong>占比</strong>＝该等级记录数 ÷ 所选范围有效学术评价记录总数 × 100%。</p>
        <p>总体为合并计数，非等权平均。等级筛选只改曲线，不改分母。</p>
        <p>未同步 / 无数据学段不打点、不跨空段连线。</p>`;
  }

  const notesLegend = trendCompact
    ? `<div class="notes-legend-row">${ACADEMIC.map((g,i)=>`<span><i class="swatch" style="background:${COLOR_HEX[i]}"></i><strong>${g}</strong></span>`).join('')}</div>`
    : ACADEMIC.map((g,i)=>`<p><span class="swatch" style="background:${COLOR_HEX[i]}"></span> <strong>${g}</strong></p>`).join('') + '<hr>';

  wrap.classList.toggle('compact', trendCompact);
  wrap.innerHTML = `
    <div class="trend-toolbar">
      <div>
        <h3>「学术等级占比」学年趋势</h3>
        <p>${subtitle}</p>
      </div>
    </div>
    <div class="filters">
      ${scopeFilter}
      <div class="filter-line">
        <strong>等级</strong>
        ${ACADEMIC.map((g,i)=>`<label><input type="checkbox" value="${g}" ${state.trendGrades.has(g)?'checked':''} onchange="toggleTrendGrade('${g}',this.checked)"><span class="swatch" style="background:${COLOR_HEX[i]}"></span>${g}</label>`).join('')}
      </div>
    </div>
    <div class="chart-grid${trendCompact?' stack':''}">
      <section class="chart-card${trendCompact?' compact':''}">
        ${chartHead}
        ${trendCompact?'<span id="scopeTitle" hidden></span><span id="chartMeta" hidden></span>':''}
        <div id="chartTip" class="chart-tooltip" role="tooltip"></div>
        <div id="chart"></div>
      </section>
      <aside class="notes-card${trendCompact?' below':''}">
        <h4>图例与计算说明</h4>
        ${notesLegend}
        ${notesExtra}
      </aside>
    </div>`;
  drawChart(series);
}

function setTrendScope(v){ state.trendScope = v; renderTrend(); }
function toggleTrendGrade(g, on){
  if(on) state.trendGrades.add(g); else state.trendGrades.delete(g);
  renderTrend();
}

function showChartTip(ev, seg, grade, count, total, pct){
  const tip = document.getElementById('chartTip');
  const card = tip?.closest('.chart-card');
  const svg = document.querySelector('#chart svg');
  if(!tip || !card || !svg) return;
  const pt = ev.currentTarget?.querySelector('circle[stroke]') || ev.currentTarget;
  const rect = card.getBoundingClientRect();
  const cRect = pt.getBoundingClientRect();
  tip.innerHTML = `<strong>第${seg}学段 · ${grade}</strong><br>${count} 个 / 共 ${total} 个<br>占比 ${pct.toFixed(1)}%`;
  tip.style.left = (cRect.left + cRect.width/2 - rect.left) + 'px';
  tip.style.top = (cRect.top - rect.top) + 'px';
  tip.classList.add('show');
}
function hideChartTip(){
  document.getElementById('chartTip')?.classList.remove('show');
}

function drawChart(series){
  const segs = axisSegments();
  const selected = state.trendScope==='overall' ? series : series.filter(s=>s.name===state.trendScope);
  const scopeTitle = document.getElementById('scopeTitle');
  const chartMeta = document.getElementById('chartMeta');
  if(scopeTitle && !scopeTitle.hidden){
    scopeTitle.textContent = state.trendScope==='overall' ? '总体等级分布' : state.trendScope + '等级分布';
  }
  if(chartMeta && !chartMeta.hidden){
    chartMeta.textContent = `${state.trendScope==='overall'?'总体合并': '单范围'} · ${state.trendGrades.size} 个等级`;
  }

  const compactChart = band()==='primary' || band()==='junior' || band()==='high';
  // 右侧留白加大，避免「第6学段」被裁切；左侧与刻度右对齐
  const W=960, H=compactChart?200:300, L=52, R=compactChart?48:28, T=compactChart?28:22, B=compactChart?36:46;
  const x = i => L + i * (W-L-R) / Math.max(segs.length-1,1);
  const y = v => H - B - v * (H-T-B) / 100;
  const tickX = L - 8;

  let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="学年学术等级占比折线图">`;
  // 「占比 %」与 Y 轴刻度同列右对齐（text-anchor=end）
  svg += `<text x="${tickX}" y="14" text-anchor="end" fill="#8a929f" font-size="11">占比 %</text>`;
  for(let v=0;v<=100;v+=20){
    svg += `<line x1="${L}" y1="${y(v)}" x2="${W-R}" y2="${y(v)}" stroke="#e9edf2"/><text x="${tickX}" y="${y(v)+3}" text-anchor="end" fill="#8a929f" font-size="10">${v}%</text>`;
  }
  segs.forEach((seg,i)=>{
    svg += `<text x="${x(i)}" y="${H-12}" text-anchor="middle" font-size="11" fill="#646d7b">第${seg}学段</text>`;
  });

  if(!selected.length || !state.trendGrades.size){
    svg += `<text x="${W/2}" y="${H/2}" text-anchor="middle" fill="#969eaa" font-size="14">请至少选择一个等级</text></svg>`;
    document.getElementById('chart').innerHTML = svg;
    return;
  }

  ACADEMIC.forEach((g, gi)=>{
    if(!state.trendGrades.has(g)) return;
    let poly = [];
    const flush = ()=>{
      if(poly.length>=2){
        svg += `<polyline points="${poly.map(p=>`${p.x},${p.y}`).join(' ')}" fill="none" stroke="${COLOR_HEX[gi]}" stroke-width="2.4"/>`;
      }
      poly = [];
    };
    segs.forEach((seg, i)=>{
      const vectors = selected.map(s=>s.v[seg-1]);
      if(vectors.some(v=>v==null)){ flush(); return; }
      const total = vectors.reduce((n,v)=>n+v.reduce((a,b)=>a+b,0),0);
      if(total===0){ flush(); return; }
      const count = vectors.reduce((n,v)=>n+v[gi],0);
      const pct = 100 * count / total;
      const px = x(i), py = y(pct);
      poly.push({x:px,y:py});
      const handler = `showChartTip(event,${seg},'${g}',${count},${total},${pct})`;
      svg += `<g tabindex="0" role="button" aria-label="第${seg}学段 ${g} ${count}个 占比${pct.toFixed(1)}%" onfocus="${handler}" onmouseenter="${handler}" onmouseleave="hideChartTip()">
        <circle cx="${px}" cy="${py}" r="12" fill="transparent"/>
        <circle cx="${px}" cy="${py}" r="4.4" fill="#fff" stroke="${COLOR_HEX[gi]}" stroke-width="2.4"/>
      </g>`;
    });
    flush();
  });

  svg += '</svg>';
  document.getElementById('chart').innerHTML = svg;
  hideChartTip();
}

fillSelectors();
renderReport();
</script>
